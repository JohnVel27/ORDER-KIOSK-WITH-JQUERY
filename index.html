<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk UI - Order System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 flex justify-center items-start min-h-screen ">
     <!-- Backdrop -->
  <div id="sidebar-backdrop" class="fixed inset-0 bg-black bg-opacity-30 z-10 hidden md:hidden"></div>

    <!-- Floating Mobile Sidebar Toggle Button with Spoon and Fork Icon -->
    <button id="sidebar-toggle" class="md:hidden fixed bottom-6 right-6 z-40 p-4 rounded-full bg-yellow-500 text-white shadow-xl hover:bg-yellow-600 transition duration-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
        <path d="M7 2C6.447 2 6 2.447 6 3v7a1 1 0 001 1v11a1 1 0 102 0V11a1 1 0 001-1V3c0-.553-.447-1-1-1H7zm10.707 2.293a1 1 0 00-1.414 0L15 5.586V3a1 1 0 00-2 0v7a1 1 0 001 1h1v11a1 1 0 102 0V11h1a1 1 0 001-1V6.414l-1.293-1.293z"/>
        </svg>
    </button>

  <div class="w-full max-w-6xl bg-white shadow-xl rounded-lg overflow-hidden min-h-screen flex flex-col mx-auto">

    <!-- Carousel -->
    <div class="relative w-full h-30 md:h-96 overflow-hidden rounded-t-lg">
      <div id="carousel" class="flex transition-transform duration-500 ease-in-out w-full h-full">
        <img src="images/1.jpg" alt="Promo 1" class="w-full h-full object-cover flex-shrink-0">
        <img src="images/2.jpg" alt="Promo 2" class="w-full h-full object-cover flex-shrink-0">
        <img src="images/3.jpg" alt="Promo 3" class="w-full h-full object-cover flex-shrink-0">
      </div>
    </div>

    <!-- Main content area -->
    <div class="flex flex-1 overflow-hidden relative">
      
      <!-- Sidebar (drawer style on mobile, fixed on desktop) -->
      <aside id="sidebar" class="fixed md:static top-0 right-0 w-64 h-full md:h-auto bg-white border-l border-gray-200 p-4 z-30 transform translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out overflow-y-auto">
        <button data-category="Main Dishes" class="category-btn p-2 w-full rounded-lg hover:bg-gray-100 transition duration-150 text-center">
          <img src="images/Maindishes.png" alt="Main Dishes" class="w-24 h-24 mx-auto object-contain rounded mb-1">
          <p class="text-sm md:text-base">Main Dishes</p>
        </button>
        <button data-category="Appetizers" class="category-btn p-2 w-full rounded-lg hover:bg-gray-100 transition duration-150 text-center">
          <img src="images/Appetizer.png" alt="Appetizer" class="w-24 h-24 mx-auto object-contain rounded mb-1">
          <p class="text-sm md:text-base">Appetizers</p>
        </button>
        <button data-category="Soups and Stews" class="category-btn p-2 w-full rounded-lg hover:bg-gray-100 transition duration-150 text-center category-active">
          <img src="images/SoupsandStews.png" alt="Soups and Stews" class="w-24 h-24 mx-auto object-contain rounded mb-1">
          <p class="text-sm md:text-base">Soups/Stews</p>
        </button>
        <button data-category="Beverages" class="category-btn p-2 w-full rounded-lg hover:bg-gray-100 transition duration-150 text-center">
          <img src="images/Beverages.png" alt="Beverages" class="w-24 h-24 mx-auto object-contain rounded mb-1">
          <p class="text-sm md:text-base">Beverages</p>
        </button>
        <button data-category="Rice Dishes" class="category-btn p-2 w-full rounded-lg hover:bg-gray-100 transition duration-150 text-center">
          <img src="images/RiceDishes.png" alt="Rice Dishes" class="w-24 h-24 mx-auto object-contain rounded mb-1">
          <p class="text-sm md:text-base">Rice Dishes</p>
        </button>
        <button data-category="Desserts" class="category-btn p-2 w-full rounded-lg hover:bg-gray-100 transition duration-150 text-center">
          <img src="images/Dessert.png" alt="Desserts" class="w-24 h-24 mx-auto object-contain rounded mb-1">
          <p class="text-sm md:text-base">Desserts</p>
        </button>
      </aside>

      <!-- Main product area -->
      <main class="flex-1 bg-gray-50 p-4 md:p-6 overflow-y-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-4 md:mb-6">
          <h1 id="category-title" class="text-xl md:text-2xl font-bold text-gray-800 mb-2 md:mb-0">Soups and Stews</h1>
          <div class="relative w-full md:w-auto">
            <input type="text" id="search-input" placeholder="Search in category" class="w-full border border-gray-300 rounded-full py-1.5 pl-4 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent transition duration-150">
            <span class="absolute inset-y-0 right-0 flex items-center pr-3">
              <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
              </svg>
            </span>
          </div>
        </div>

        <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 gap-y-6">
          <!-- Product items dynamically go here -->
        </div>
      </main>
    </div>

    <!-- Footer -->
    <footer class="bg-gradient-to-br from-[#FF9D23] to-[#FFB84C] text-white p-4 border-solid border-2 border-[#D97B20]">
        <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-2">
          <div class="text-center md:text-left">
            <p class="font-medium text-shadow">Order Summary: <span id="order-item-count" class="font-bold ml-2">0 items</span></p>
            <p class="text-sm text-shadow">Total: <span id="order-total-price" class="font-bold">₱ 0.00</span></p>
            <p class="text-xs mt-1 text-shadow">Last added: <span id="last-item-name">None</span></p>
          </div>
          <div class="flex items-center space-x-4">
            <button id="view-order-btn" class="text-sm hover:text-yellow-700 font-medium text-shadow">View/Edit Order</button>
          </div>
        </div>
      
        <div class="flex justify-between space-x-4">
          <button id="cancel-order-btn" class="flex-1 bg-white border border-red-500 text-red-500 py-2 px-4 rounded-lg font-semibold hover:bg-red-50 transition duration-150 text-sm md:text-base">
            Cancel Order
          </button>
          <button id="finalize-order-btn" class="flex-1 bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-lg font-semibold transition duration-150 text-sm md:text-base disabled:opacity-50 disabled:cursor-not-allowed" disabled>
            Finalize & Pay
          </button>
        </div>
      </footer>
      
      
      
  </div>

    <div id="order-modal" class="modal ">
        <div class="modal-content bg-gradient-to-br from-[#FF9D23] to-[#FFB84C]">
            <span class="close-btn" id="close-modal-btn">&times;</span>
            <h2 class="text-xl font-bold mb-4 text-white">Your Order</h2>
            <div id="modal-order-list" class="mb-4 max-h-60 overflow-y-auto">
                </div>
            <div class="text-right font-bold text-lg mb-4 text-white">
                Total: <span id="modal-total-price text-white">₱ 0.00</span>
            </div>
            <div class="flex justify-end">
                 <button id="modal-finalize-btn" class="bg-green-500 hover:bg-green-600 text-white py-2 px-6 rounded-lg font-semibold transition duration-150 disabled:opacity-50 disabled:cursor-not-allowed">Finalize & Pay</button>
            </div>
        </div>
    </div>

    <div id="receipt-modal" class="modal">
        <div class="modal-content relative bg-gradient-to-br from-[#FF9D23] to-[#FFB84C] text-white p-6 rounded-lg shadow-lg w-full max-w-md">

            <!-- Logo at top-right -->
            <img src="images/mangvel.png" alt="Logo" class="absolute top-0 right-4 w-16 h-auto ">
        
            <!-- Close button -->
            <span class="close-btn absolute top-4 left-4 text-white text-2xl cursor-pointer" id="close-receipt-btn">&times;</span>
        
            <!-- Modal Heading -->
            <h2 class="text-2xl font-bold mb-4 text-center">Receipt</h2>
        
            <!-- Receipt Content -->
            <div id="receipt-content" class="text-sm border-t border-b py-4 my-4 border-dashed border-white"></div>
        
            <!-- Footer -->
            <p class="text-center font-semibold mb-4">Thank you for your order!</p>
        
            <div class="text-center">
              <button id="new-order-btn" class="bg-white text-[#FF9D23] hover:bg-gray-100 py-2 px-6 rounded-lg font-semibold transition duration-150">Start New Order</button>
            </div>
        
          </div>
    </div>

    </body>

    <script src="script.js"></script> </body>
</html>
